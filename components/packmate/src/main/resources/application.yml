spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/packmate}
    username: ${SPRING_DATASOURCE_USERNAME:packmate}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:65000}
  compression:
    enabled: true
    min-response-size: 1KB
  error:
    include-message: never
    include-stacktrace: never

packmate:
  capture-mode: ${PACKMATE_CAPTURE_MODE:FILE}
  interface-name: ${PACKMATE_INTERFACE_NAME:lo}
  pcap-file: ${PACKMATE_PCAP_FILE:/pcaps/capture.pcap}
  local-ip: ${PACKMATE_LOCAL_IP:127.0.0.1}
  web:
    account-login: ${PACKMATE_USERNAME:packmate}
    account-password: ${PACKMATE_PASSWORD:}
  timeout:
    udp-stream-timeout: 20
    tcp-stream-timeout: 40
    check-interval: 10
  cleanup:
    enabled: true
    threshold: 240
    interval: 5
  ignore-empty-packets: true
